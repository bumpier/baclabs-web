# /etc/nginx/sites-available/baclab.conf
#
# SECOND tenant on this box. The pre-existing app owns its own nginx site,
# its own upstream name, 127.0.0.1:3000 and its own certbot certificate.
# NOTHING here may reuse any of those, and certbot must always be run for
# this site with --cert-name baclab. Expanding the other site's certificate
# with a BacLab domain would couple the two sites' renewals together.
#
# certbot --nginx adds the :443 server block and the http->https redirect.

upstream baclab_app {
    # MUST match BACLAB_HOST_PORT in /srv/baclab/.env.local (default 3001).
    # These are two separate files that have to agree; if the site returns
    # 502 after a port change, this line is why.
    server 127.0.0.1:3001;
    keepalive 64;
}

server {
    listen 80;
    listen [::]:80;
    # ⚠ CONFIRM THIS DOMAIN before going live. Inferred from the support
    # address in config/brand.ts (hello@baclab.co.uk). baclab-add-domain.sh
    # edits THIS line.
    server_name baclab.co.uk www.baclab.co.uk;

    client_max_body_size 6m;   # admin product image uploads are capped at 5MB

    location / {
        proxy_pass http://baclab_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 300s;
    }

    # Security headers come from the app (next.config.js), not from here.
    # Duplicating them in nginx produces two conflicting CSP headers.
}
